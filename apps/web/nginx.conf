# Serves the dashboard and proxies the API on the same origin, so no CORS is needed (design §7).
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    # Matches the API's own raw-body limit (apps/api/src/app.ts REPORT_BODY_LIMIT), discovered
    # missing during AC-34 perf verification: nginx's 1m default otherwise 413s a 1 MB Report
    # before it reaches the API.
    client_max_body_size 10m;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    proxy_pass http://api:3000;
  }

  # Client-side routes fall back to the SPA entry point.
  location / {
    try_files $uri /index.html;
  }
}
