name: flaky-test-tracker

x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: flaky-test-tracker-api:local

x-database-url: &database-url postgresql://ftt:ftt@db:5432/ftt

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ftt
      POSTGRES_PASSWORD: ftt
      POSTGRES_DB: ftt
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ftt -d ftt']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *api-image
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api-image
    environment:
      DATABASE_URL: *database-url
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    <<: *api-image
    command: ['node', 'dist/worker.js']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
