name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Covers the hoisted root install and any workspace-local node_modules.
  NODE_MODULES_PATHS: |
    node_modules
    apps/*/node_modules
    packages/*/node_modules

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  lint-typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run test:unit

  integration:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true
      # Testcontainers uses the runner's Docker daemon (ADR-0010).
      - run: npm run test:integration

  e2e:
    needs: [lint-typecheck, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build
      - run: npm run demo
      - run: npm run test:e2e --workspace apps/web
      - run: docker compose down -v

  dogfood:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true
      - run: docker compose up -d --build
      - name: Create dogfood Project
        id: project
        run: bash scripts/dogfood.sh setup
      - run: docker compose --profile demo build demo
      # The fixture suite is flaky by design (FR-31): a non-zero exit is an expected outcome,
      # not a job failure. Only the JUnit file it produces matters here.
      - run: docker compose --profile demo run --rm demo || true
      - name: Submit Report via the composite action
        uses: ./.github/actions/submit-report
        with:
          url: http://localhost:8080
          token: ${{ steps.project.outputs.token }}
          file: fixtures/flaky-suite/runs/result.xml
      - name: Assert the Report processed with this run's commit and attempt
        run: bash scripts/dogfood.sh assert ${{ steps.project.outputs.project_id }}
      - if: always()
        run: docker compose down -v
