name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Covers the hoisted root install and any workspace-local node_modules.
  NODE_MODULES_PATHS: |
    node_modules
    apps/*/node_modules
    packages/*/node_modules

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  lint-typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run test:unit

  integration:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true
      # Testcontainers uses the runner's Docker daemon (ADR-0010).
      - run: npm run test:integration
